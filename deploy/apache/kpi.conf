# ---------------------------------------------------------------------------
# Apache — KPI Command Center
#
# Enable the modules the proxy needs (safe: these do not alter existing vhosts):
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#   sudo cp deploy/apache/kpi.conf /etc/apache2/sites-available/kpi.conf
#   sudo a2ensite kpi
#   sudo apachectl configtest     # ALWAYS test before reloading
#   sudo systemctl reload apache2
#
# Certificate:
#   sudo certbot --apache -d kpi.example.com
# ---------------------------------------------------------------------------

<VirtualHost *:80>
    ServerName kpi.example.com

    # Leave the ACME path reachable, redirect everything else.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName kpi.example.com

    SSLEngine on
    # certbot fills these in.
    SSLCertificateFile    /etc/letsencrypt/live/kpi.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/kpi.example.com/privkey.pem

    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Must match APP_PORT in .env. Vision extraction can be slow — allow for it.
    ProxyPass        / http://127.0.0.1:3020/ timeout=300 connectiontimeout=30
    ProxyPassReverse / http://127.0.0.1:3020/

    # A batch of phone screenshots is large (bytes).
    LimitRequestBody 209715200

    ErrorLog  ${APACHE_LOG_DIR}/kpi-error.log
    CustomLog ${APACHE_LOG_DIR}/kpi-access.log combined
</VirtualHost>
