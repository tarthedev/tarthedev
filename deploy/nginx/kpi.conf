# ---------------------------------------------------------------------------
# nginx — KPI Command Center
#
# This is a NEW server block on its own subdomain. It does not touch any site
# already configured on this server.
#
#   sudo cp deploy/nginx/kpi.conf /etc/nginx/sites-available/kpi.conf
#   sudo ln -s /etc/nginx/sites-available/kpi.conf /etc/nginx/sites-enabled/
#   sudo nginx -t          # ALWAYS test before reloading
#   sudo systemctl reload nginx
#
# Then obtain a certificate — certbot edits this file in place:
#   sudo certbot --nginx -d kpi.example.com
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name kpi.example.com;

    # Certbot writes its challenge here before the redirect applies.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kpi.example.com;

    # certbot fills these in. Until then, comment out this block and run over
    # port 80 only — never put a real password over plain HTTP.
    ssl_certificate     /etc/letsencrypt/live/kpi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kpi.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Private performance data — tell well-behaved crawlers to stay out.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A batch of phone screenshots is large. The app's own limit is
    # MAX_UPLOAD_MB x MAX_IMAGES_PER_SNAPSHOT; give nginx room above it.
    client_max_body_size 200M;
    client_body_timeout 300s;

    location / {
        # Must match APP_PORT in .env.
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Vision extraction on a large batch can take a while; do not cut it off.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Immutable build assets — safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
