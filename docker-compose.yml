# KPI Command Center — production stack.
#
# Everything binds to 127.0.0.1 only. The reverse proxy already on the VPS
# (nginx, Caddy or Apache) terminates TLS and forwards to 127.0.0.1:${APP_PORT}.
# Nothing in this file opens a public port or touches an existing web server.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kpi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-kpi}
      # Deterministic collation keeps index behaviour identical across restores.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backups:/backups
    # Published on loopback only so Postgres is never exposed to the internet.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kpi} -d ${POSTGRES_DB:-kpi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kpi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kpi}?schema=public
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kpi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kpi}?schema=public
      STORAGE_PATH: /app/storage
      PORT: "3000"
    volumes:
      - app-storage:/app/storage
    ports:
      - "127.0.0.1:${APP_PORT:-3020}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
  app-storage:
