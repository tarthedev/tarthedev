# Local development database. Production compose lives in infra/.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dwrg
      POSTGRES_PASSWORD: dwrg
      POSTGRES_DB: dwrg_dev
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  dbdata:
