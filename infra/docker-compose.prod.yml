# One environment of the DWRG platform on the droplet (docs/runbooks/deploy.md).
#
# Always run it through infra/scripts/dc.sh, which sets DWRG_ENV, reads that
# environment's settings file and adds the staging override when needed:
#
#   infra/scripts/dc.sh production ps
#   infra/scripts/dc.sh staging logs -f api
#
#   production  this file                                compose project "dwrg-production"
#   staging     this file + docker-compose.staging.yml   compose project "dwrg-staging"
#
# There is no database container: both environments use DigitalOcean Managed
# PostgreSQL (one cluster, database dwrg_production or dwrg_staging) through
# DATABASE_URL in /opt/dwrg/<env>/app.env.
#
# Images are built on the droplet by infra/scripts/deploy.sh: dwrg-api:<git sha>,
# then tagged dwrg-api:production or dwrg-api:staging. Moving that tag and
# running `up -d` is how a version is deployed or rolled back.

name: dwrg-${DWRG_ENV:?run compose through infra/scripts/dc.sh, which sets DWRG_ENV}

x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

# Shared by api, worker and migrate: the API image (apps/api/Dockerfile).
x-server: &server
  image: dwrg-api:${DWRG_ENV}
  init: true
  env_file:
    - path: ${DWRG_HOME:-/opt/dwrg}/${DWRG_ENV}/app.env
      required: true
  environment:
    DWRG_ENV: ${DWRG_ENV}
    # Trust the managed database's CA, so DATABASE_URL can use sslmode=verify-full.
    NODE_EXTRA_CA_CERTS: /run/dwrg/db-ca.crt
  volumes:
    - type: bind
      source: ${DWRG_HOME:-/opt/dwrg}/db-ca.crt
      target: /run/dwrg/db-ca.crt
      read_only: true
      bind:
        create_host_path: false
  # The code can't be changed at runtime; only /tmp is writable (tsx's compile
  # cache lives there). Files the app keeps belong in Spaces, not on disk.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

services:
  api:
    <<: *server
    restart: unless-stopped
    # Time for in-flight requests to finish after SIGTERM.
    stop_grace_period: 30s
    # The healthcheck (GET /health) is in the image. Docker doesn't restart an
    # unhealthy container by itself; infra/scripts/restart-unhealthy.sh does,
    # for containers with this label.
    labels:
      dwrg.restart-when-unhealthy: "true"
    networks:
      default: {}
      edge:
        # Caddy reaches this environment's API by this name.
        aliases: ["api-${DWRG_ENV}"]

  worker:
    <<: *server
    restart: unless-stopped
    # Time for a running job to finish after SIGTERM.
    stop_grace_period: 60s
    labels:
      dwrg.restart-when-unhealthy: "true"
    working_dir: /app
    # PLACEHOLDER until apps/worker has its jobs: does nothing but keep the
    # heartbeat file fresh. The real worker needs pg-boss, which this image
    # doesn't install yet: add the worker to the image (or give it its own) and
    # replace this command. Whatever runs here must write /tmp/worker-heartbeat
    # at least once a minute; the healthcheck below reads it.
    command:
      - node
      - -e
      - >-
        const fs = require("node:fs");
        const beat = () => fs.writeFileSync("/tmp/worker-heartbeat", String(Date.now()));
        beat(); setInterval(beat, 30000);
        console.log("worker placeholder: no jobs yet");
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const age = Date.now() - require("node:fs").statSync("/tmp/worker-heartbeat").mtimeMs;
          process.exit(age < 120000 ? 0 : 1);
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
      retries: 3

  # One-off: apply database migrations. deploy.sh runs it with the new image
  # (MIGRATE_TAG=<sha>) before switching versions; by hand:
  #   infra/scripts/dc.sh production run --rm migrate
  migrate:
    <<: *server
    image: dwrg-api:${MIGRATE_TAG:-${DWRG_ENV}}
    profiles: [tools]
    restart: "no"
    working_dir: /app/packages/db
    command: ["node", "--import", "tsx", "src/migrate.ts"]
    healthcheck:
      disable: true

  # HTTPS for both environments (infra/Caddyfile). Runs in the production
  # project only; docker-compose.staging.yml switches it off for staging.
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in /opt/dwrg/production/app.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in /opt/dwrg/production/app.env}
    # The whole infra folder, not just the Caddyfile: a single-file mount would
    # keep showing the old file after a deploy replaces it, so `caddy reload`
    # would never see the change.
    command: ["caddy", "run", "--config", "/etc/dwrg-infra/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./:/etc/dwrg-infra:ro
      - ${DWRG_HOME:-/opt/dwrg}/production/web:/srv/production:ro
      - ${DWRG_HOME:-/opt/dwrg}/staging/web:/srv/staging:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    labels:
      dwrg.restart-when-unhealthy: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 3
    networks:
      - edge
    logging: *logging

networks:
  # Shared by the production and staging projects so the one Caddy can reach
  # both APIs. Created once: docker network create dwrg-edge
  edge:
    name: dwrg-edge
    external: true

volumes:
  # Certificates and ACME account. Losing it only means Caddy asks for new
  # certificates (mind Let's Encrypt's rate limits).
  caddy_data:
  caddy_config:
